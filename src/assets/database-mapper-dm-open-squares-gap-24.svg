<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Database Mapper DM monogram concept</title>
  <desc id="desc">Two compact black open rounded squares form an abstract D and M on a transparent background.</desc>

  <g
    fill="none"
    stroke="#000000"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- D: a rounded square with its left edge removed -->
    <path d="M28 78h64c9 0 16 7 16 16v68c0 9-7 16-16 16H28" />

    <!-- M: a rounded square with its bottom edge removed -->
    <path d="M148 178V94c0-9 7-16 16-16h56c9 0 16 7 16 16v84" />
  </g>
</svg>
